# Guard configuration for this project.
#
# See guards.conf.example in the template for what each knob does.

APP="."
APP_PREFIX="$(app_prefix "$APP")"

# The branch PRs merge into; a local run diffs against origin/$BASE_BRANCH.
BASE_BRANCH="main"

VERSION_FILE="${APP_PREFIX}VERSION"
VERSION_FIELDS=3
VERSION_MIRRORS=""
CHANGELOG="${APP_PREFIX}CHANGELOG.md"
CHANGELOG_ARCHIVE_DIR="${APP_PREFIX}docs/changelog"
CHANGELOG_ARCHIVE_CMD="make changelog-archive"
RETRO_DIR="${APP_PREFIX}docs/retros"

# The app and the scripts that put it on the TV.
DOCS_CODE_PATTERN="^${APP_PREFIX}(src/.*\.java|AndroidManifest\.xml|(build|install|undo|check)\.sh|tools/.*\.sh)$"
# Java only; the shell scripts are exercised against the TV, not in CI.
TESTS_CODE_PATTERN="^${APP_PREFIX}src/.*\.java$"
TESTS_TARGET_PATTERN="^${APP_PREFIX}tests/.*\.(java|sh)$"
DOCS_TARGET_PATTERN="^(${APP_PREFIX}docs/.*\.md|${APP_PREFIX}README\.md|${APP_PREFIX}CLAUDE\.md)$"
DOCS_HINT="  - behaviour or a finding -> ${APP_PREFIX}docs/ARCHITECTURE.md
  - how to use it           -> ${APP_PREFIX}README.md"

# EMPTY = the PATCH-bump challenge is off. Fill this in with whatever
# a new user-visible surface looks like here (a route, a page, a tool).
# A new Android component (activity, service, receiver) is new capability.
CAPABILITY_ADD_PATTERN="^${APP_PREFIX}src/.*(Activity|Service|Dream|Receiver)\.java$"

RETRO_DEBT_MAX=8
ALLOW_COMMIT_TAGS=1
SCOPE_RULES="app:^${APP_PREFIX}
ci_config:^\.github/"
# A DENY-list: paths that never need the test suite (emitted as `code`).
# Empty = the suite always runs, the safe direction to be wrong in.
SCOPE_SKIP=""
